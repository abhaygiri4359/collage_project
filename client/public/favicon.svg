<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Accent Emerald/Cyan Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container (Squircle) -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2.5" />
  
  <!-- Outer Glow Ring -->
  <rect x="7" y="7" width="114" height="114" rx="29" fill="none" stroke="url(#primaryGrad)" stroke-width="1.5" opacity="0.35" />

  <!-- Top Antenna / Spark Sensor -->
  <circle cx="64" cy="24" r="5" fill="#34d399" filter="url(#softGlow)" />
  <path d="M64 29 V36" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" />

  <!-- Bot Head Container -->
  <rect x="28" y="36" width="72" height="56" rx="20" fill="#1e293b" stroke="url(#primaryGrad)" stroke-width="3.5" />

  <!-- Interview Headset / Ear Cushions -->
  <rect x="20" y="51" width="8" height="26" rx="4" fill="url(#primaryGrad)" />
  <rect x="100" y="51" width="8" height="26" rx="4" fill="url(#primaryGrad)" />

  <!-- Screen / Visor -->
  <rect x="36" y="46" width="56" height="34" rx="13" fill="#090d16" stroke="#334155" stroke-width="1.5" />

  <!-- Voice / AI Audio Frequency Waves (Interview Simulation) -->
  <rect x="44" y="57" width="5" height="12" rx="2.5" fill="url(#waveGrad)" />
  <rect x="52" y="53" width="5" height="20" rx="2.5" fill="url(#waveGrad)" />
  <rect x="60" y="50" width="5" height="26" rx="2.5" fill="#38bdf8" filter="url(#softGlow)" />
  <rect x="68" y="53" width="5" height="20" rx="2.5" fill="url(#waveGrad)" />
  <rect x="76" y="58" width="5" height="10" rx="2.5" fill="url(#waveGrad)" />

  <!-- Smart AI Sparkle in top-right corner -->
  <path d="M102 18 C102 24 107 26 111 26 C107 26 102 28 102 34 C102 28 97 26 93 26 C97 26 102 24 102 18 Z" fill="#38bdf8" filter="url(#softGlow)" />
</svg>
